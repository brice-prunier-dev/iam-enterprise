version: '3.8'
services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    working_dir: /workspaces/iam-enterprise
    environment:
      - NODE_ENV=development
    networks:
      - iam-enterprise-network

  mongodb:
    image: mongo:7
    container_name: iam-enterprise-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: iam-enterprise
    volumes:
      - mongodb_data:/data/db
    networks:
      - iam-enterprise-network

volumes:
  mongodb_data:

networks:
  iam-enterprise-network:
    driver: bridge